message SheetData {
  string table = 1;
  string sheet = 2;
  repeated bytes data = 3;
}

message ConfigTables {
  string version = 1;
  string header_hash = 2;
  // 字段 3 (schemas) 此处省略，解码时作为未知字段忽略
  repeated SheetData datas = 4;
}
