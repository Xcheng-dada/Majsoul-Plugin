  string lock_tips_jp = 16;
  string lock_tips_en = 17;
  string lock_tips_kr = 18;
  string spot_scale = 19;
  string path = 20;
  uint32 exchange_item_id = 21;
  int32 exchange_item_num = 22;
  uint32 direction = 23;
  uint32 no_reverse = 24;
  uint32 lock_reverse = 25;
  int32 offset_x = 26;
  int32 offset_y = 27;
  string effective_time = 28;
  string lobby_offset = 29;
  string liaoshe_offset = 30;
  string shop_offset = 31;
  string win_offset = 32;
  string gameend_offset = 33;
  string starup_offset = 34;
  string treasure_offset = 35;
