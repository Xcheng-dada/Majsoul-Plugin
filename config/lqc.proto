  int32 smallhead_y = 48;
  int32 smallhead_width = 49;
  int32 full_x = 50;
  int32 full_y = 51;
  int32 full_width = 52;
  int32 full_height = 53;
  int32 half_x = 54;
  int32 half_y = 55;
  int32 half_width = 56;
  int32 half_height = 57;
